version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: evershop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-evershop}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evershop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evershop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-evershop}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_to_a_secure_random_string_min_32_chars}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - media_data:/app/media
      - assets_data:/app/public/assets
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  assets_data:
    driver: local
